<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0a0e18"/>
  <!-- subtle grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#1f2937" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1f2937" stroke-width="1"/>
  <!-- accent bar -->
  <rect x="80" y="220" width="4" height="190" fill="#1D9E75"/>
  <!-- main title -->
  <text x="110" y="300" font-family="monospace" font-size="64" font-weight="500" fill="#ffffff" letter-spacing="4">CIVILGATE</text>
  <!-- tagline -->
  <text x="110" y="358" font-family="monospace" font-size="22" fill="#9ca3af" letter-spacing="1">World Government Policy Tracker</text>
  <!-- descriptor line -->
  <text x="110" y="396" font-family="monospace" font-size="18" fill="#4b5563">Plain-language summaries · Impact scores · Live trends</text>
  <!-- score circles -->
  <circle cx="820" cy="220" r="60" fill="none" stroke="#1D9E75" stroke-width="2" opacity="0.6"/>
  <text x="820" y="214" font-family="monospace" font-size="11" fill="#1D9E75" text-anchor="middle" letter-spacing="1">SOCIAL</text>
  <text x="820" y="236" font-family="monospace" font-size="28" font-weight="500" fill="#1D9E75" text-anchor="middle">+8</text>
  <circle cx="960" cy="220" r="60" fill="none" stroke="#5DCAA5" stroke-width="2" opacity="0.6"/>
  <text x="960" y="214" font-family="monospace" font-size="11" fill="#5DCAA5" text-anchor="middle" letter-spacing="1">ENV</text>
  <text x="960" y="236" font-family="monospace" font-size="28" font-weight="500" fill="#5DCAA5" text-anchor="middle">+6</text>
  <circle cx="1100" cy="220" r="60" fill="none" stroke="#EF9F27" stroke-width="2" opacity="0.6"/>
  <text x="1100" y="214" font-family="monospace" font-size="11" fill="#EF9F27" text-anchor="middle" letter-spacing="1">ECON</text>
  <text x="1100" y="236" font-family="monospace" font-size="28" font-weight="500" fill="#EF9F27" text-anchor="middle">−4</text>
  <!-- region badges -->
  <rect x="820" y="360" width="60" height="24" rx="4" fill="#1a4034"/>
  <text x="850" y="376" font-family="monospace" font-size="10" fill="#1D9E75" text-anchor="middle" letter-spacing="1">EU</text>
  <rect x="892" y="360" width="60" height="24" rx="4" fill="#3d2e0a"/>
  <text x="922" y="376" font-family="monospace" font-size="10" fill="#EF9F27" text-anchor="middle" letter-spacing="1">US</text>
  <rect x="964" y="360" width="60" height="24" rx="4" fill="#0e2540"/>
  <text x="994" y="376" font-family="monospace" font-size="10" fill="#378ADD" text-anchor="middle" letter-spacing="1">UK</text>
  <rect x="1036" y="360" width="60" height="24" rx="4" fill="#1a2535"/>
  <text x="1066" y="376" font-family="monospace" font-size="10" fill="#6b7280" text-anchor="middle" letter-spacing="1">CA</text>
  <rect x="1108" y="360" width="60" height="24" rx="4" fill="#1a2535"/>
  <text x="1138" y="376" font-family="monospace" font-size="10" fill="#6b7280" text-anchor="middle" letter-spacing="1">AU</text>
  <!-- live indicator -->
  <circle cx="110" cy="450" r="5" fill="#1D9E75"/>
  <text x="124" y="455" font-family="monospace" font-size="14" fill="#4b5563" letter-spacing="1">civilgate.org</text>
</svg>

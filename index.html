<style>
:root {
  --bg:      #0a0e18;
  --surface: #111827;
  --border:  #1f2937;
  --border2: #374151;
  --text:    #e5e7eb;
  --sub:     #9ca3af;
  --muted:   #4b5563;
  --social:  #1D9E75;
  --env:     #5DCAA5;
  --eco:     #EF9F27;
  --accent:  #7F77DD;
  --eu:      #1D9E75;
  --us:      #EF9F27;
  --gb:      #378ADD;
  --ca:      #e05252;
  --au:      #7F77DD;
  --mono:    'JetBrains Mono', 'Fira Code', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

a { color: inherit; text-decoration: none; }

/* ── Header ── */
header {
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 2rem;
}

.logo {
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 500;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text);
  white-space: nowrap;
  flex-shrink: 0;
}

.header-sub {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 2rem;
  flex-shrink: 0;
}

.live-indicator {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
}

.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--social);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.3; }
}

.header-clock {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 1px;
  min-width: 5ch;
}

.volunteer-link {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.5px;
  transition: color .15s;
}
.volunteer-link:hover { color: var(--text); }

/* ── Map section ── */
.map-section {
  border-bottom: 1px solid var(--border);
}

.map-header {
  padding: .6rem 2rem;
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
}

#world-map {
  width: 100%;
  height: 380px;
  display: block;
  background: var(--surface);
}

.map-legend {
  display: flex;
  gap: 1.5rem;
  padding: .6rem 2rem;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: .4rem;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: .5px;
}

.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ── Controls ── */
.controls {
  padding: .75rem 2rem;
  display: flex;
  align-items: center;
  gap: .75rem;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}

.filter-pills {
  display: flex;
  gap: .4rem;
  flex-wrap: wrap;
}

.pill {
  padding: .25rem .75rem;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 3px;
  transition: all .15s;
  user-select: none;
}
.pill:hover { border-color: var(--border2); color: var(--text); }
.pill.active { border-color: var(--accent); color: var(--accent); }

.search-wrap {
  position: relative;
  flex: 1;
  min-width: 180px;
  max-width: 320px;
}

.search-wrap svg {
  position: absolute;
  left: .6rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}

#search {
  width: 100%;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: .3rem .6rem .3rem 2rem;
  color: var(--text);
  font-family: var(--mono);
  font-size: 11px;
  outline: none;
  transition: border-color .15s;
}
#search::placeholder { color: var(--muted); }
#search:focus { border-color: var(--border2); }

.results-count {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: .5px;
  margin-left: auto;
}

.tag-clear {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: .25rem .75rem;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  border-radius: 3px;
  cursor: pointer;
  user-select: none;
}
.tag-clear:hover { opacity: .7; }

/* ── Policy Grid ── */
main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1.5rem 2rem;
}

.policy-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
}

/* ── Policy Card ── */
.policy-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem 1.25rem;
  display: flex;
  flex-direction: column;
  gap: .6rem;
}
.policy-card:hover { border-color: var(--border2); }

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
}

.source-badge {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .5px;
  padding: 2px 8px;
  border-radius: 4px;
  flex-shrink: 0;
}
/* EU sources */
.source-badge.eu  { background: #9FE1CB; color: #085041; }
/* US sources */
.source-badge.us  { background: #FAC775; color: #633806; }
/* UK */
.source-badge.gb  { background: rgba(55,138,221,.15); color: #378ADD; border: 1px solid rgba(55,138,221,.3); }
/* Canada */
.source-badge.ca  { background: rgba(224,82,82,.15); color: #e05252; border: 1px solid rgba(224,82,82,.3); }
/* Australia */
.source-badge.au  { background: rgba(127,119,221,.15); color: #7F77DD; border: 1px solid rgba(127,119,221,.3); }

.card-date {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}

.card-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-summary {
  font-size: 13px;
  color: var(--sub);
  line-height: 1.6;
}

/* ── Score Row ── */
.score-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  border-top: 1px solid var(--border);
  padding-top: .75rem;
  margin-top: .15rem;
}

.score-col {
  padding: 0 .75rem;
  border-right: 1px solid var(--border);
  position: relative;
}
.score-col:first-child { padding-left: 0; }
.score-col:last-child  { border-right: none; }

.score-label {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
  display: block;
  margin-bottom: 2px;
}

.score-num {
  font-family: var(--mono);
  font-size: 26px;
  font-weight: 500;
  line-height: 1;
  display: block;
  margin-bottom: 4px;
}

.score-col.social .score-num { color: var(--social); }
.score-col.env    .score-num { color: var(--env); }
.score-col.eco    .score-num { color: var(--eco); }

.score-col.negative .score-num { color: #f87171; }
.score-col.neutral  .score-num { color: var(--muted); opacity: .7; }

.score-reason {
  font-size: 11px;
  color: var(--sub);
  line-height: 1.4;
  display: block;
}

/* ── Tags ── */
.tags {
  display: flex;
  gap: .3rem;
  flex-wrap: wrap;
}

.tag {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 6px;
  cursor: pointer;
  transition: color .12s, border-color .12s;
  user-select: none;
  letter-spacing: .3px;
}
.tag:hover  { color: var(--text); border-color: var(--border2); }
.tag.active { border-color: var(--accent); color: var(--accent); }

.card-link {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: .5px;
  display: inline-flex;
  align-items: center;
  gap: .3rem;
  margin-top: auto;
  transition: color .12s;
}
.card-link:hover { color: var(--text); }

/* ── Empty/loading ── */
.state-msg {
  grid-column: 1 / -1;
  text-align: center;
  padding: 4rem 2rem;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: .5px;
}

/* ── Footer ── */
footer {
  border-top: 1px solid var(--border);
  padding: 1.25rem 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.footer-text {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: .3px;
}

.footer-text a { color: var(--muted); }
.footer-text a:hover { color: var(--text); }

/* ── Responsive ── */
@media (max-width: 900px) {
  .policy-grid { grid-template-columns: 1fr; }
  #world-map { height: 250px; }
  .header-clock { display: none; }
  .header-sub { display: none; }
}

@media (max-width: 600px) {
  header, .map-header, .map-legend, .controls, main, footer { padding-left: 1rem; padding-right: 1rem; }
  #world-map { height: 180px; }
  .score-reason { display: none; }
}
</style>
</head>
<body>

<header>
  <div class="logo">CivilGate</div>
  <div class="header-sub">live government data &mdash; eu &middot; us &middot; uk &middot; ca &middot; au</div>
  <div class="header-right">
    <div class="live-indicator">
      <div class="live-dot"></div>
      <span id="updated-label">loading&hellip;</span>
    </div>
    <div class="header-clock" id="clock"></div>
    <a href="https://volunteer.civilgate.org" class="volunteer-link">volunteer &rarr;</a>
  </div>
</header>

<div class="map-section">
  <div class="map-header">select region</div>
  <svg id="world-map"></svg>
  <div class="map-legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--eu)"></div>EU</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--us)"></div>USA</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--gb)"></div>UK</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--ca)"></div>Canada</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--au)"></div>Australia</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--border2)"></div>Coming soon</div>
  </div>
</div>

<div class="controls">
  <div class="filter-pills" id="filter-pills">
    <button class="pill active" data-filter="ALL">All</button>
    <button class="pill" data-filter="EU">EU</button>
    <button class="pill" data-filter="US">USA</button>
    <button class="pill" data-filter="GB">UK</button>
    <button class="pill" data-filter="CA">Canada</button>
    <button class="pill" data-filter="AU">Australia</button>
  </div>
  <div id="tag-chip-wrap"></div>
  <div class="search-wrap">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="search" id="search" placeholder="search policies, tags&hellip;" autocomplete="off">
  </div>
  <div class="results-count" id="results-count"></div>
</div>

<main>
  <div class="policy-grid" id="policy-grid">
    <div class="state-msg">loading&hellip;</div>
  </div>
</main>

<footer>
  <div class="footer-text">
    &copy; <span id="year"></span> CivilGate &mdash;
    <a href="https://www.federalregister.gov" target="_blank" rel="noopener">Federal Register</a> &middot;
    <a href="https://publications.europa.eu" target="_blank" rel="noopener">EUR-Lex</a> &middot;
    <a href="https://ec.europa.eu/commission/presscorner" target="_blank" rel="noopener">EC Press</a> &middot;
    <a href="https://www.gov.uk" target="_blank" rel="noopener">GOV.UK</a> &middot;
    <a href="https://www.gazette.gc.ca" target="_blank" rel="noopener">Canada Gazette</a> &middot;
    <a href="https://www.legislation.gov.au" target="_blank" rel="noopener">AU Legislation</a>
  </div>
  <div class="footer-text">
    <a href="https://volunteer.civilgate.org">volunteer matching</a>
  </div>
</footer>

<script>
// ── World Map ──────────────────────────────────────────────────────────────

const EU_CODES = new Set([40,56,100,191,196,203,208,233,246,250,276,300,348,372,380,428,440,442,470,528,616,620,642,703,705,724,752]);
const US_CODES = new Set([840]);
const GB_CODES = new Set([826]);
const CA_CODES = new Set([124]);
const AU_CODES = new Set([36,554]);
const PLANNED  = new Set([682,784,634,414,48,512,368,364,376,400,422,760,887,818,156,76,32,152,170,862,604,218,68,600,858,328,740]);

async function renderMap(world) {
  const svg = d3.select('#world-map');
  const el  = document.getElementById('world-map');

  await new Promise(r => requestAnimationFrame(r));
  const rect = el.getBoundingClientRect();
  const W = rect.width  || 960;
  const H = rect.height || 380;

  svg.attr('viewBox', `0 0 ${W} ${H}`);

  const projection = d3.geoNaturalEarth1().fitSize([W, H], {type: 'Sphere'});
  const path = d3.geoPath().projection(projection);

  const countries = topojson.feature(world, world.objects.countries).features;

  const tooltip = d3.select('body').append('div')
    .style('position', 'fixed')
    .style('background', '#1f2937')
    .style('border', '1px solid #374151')
    .style('border-radius', '4px')
    .style('padding', '.3rem .6rem')
    .style('font-family', 'JetBrains Mono, monospace')
    .style('font-size', '10px')
    .style('letter-spacing', '1px')
    .style('text-transform', 'uppercase')
    .style('color', '#9ca3af')
    .style('pointer-events', 'none')
    .style('opacity', '0')
    .style('transition', 'opacity .12s')
    .style('z-index', '100');

  svg.selectAll('path')
    .data(countries)
    .join('path')
    .attr('d', path)
    .attr('fill', d => {
      const id = +d.id;
      if (EU_CODES.has(id)) return '#1D9E75';
      if (US_CODES.has(id)) return '#EF9F27';
      if (GB_CODES.has(id)) return '#378ADD';
      if (CA_CODES.has(id)) return '#e05252';
      if (AU_CODES.has(id)) return '#7F77DD';
      if (PLANNED.has(id))  return '#1e3050';
      return '#1f2937';
    })
    .attr('stroke', '#0a0e18')
    .attr('stroke-width', .3)
    .on('mouseover', function(event, d) {
      const id = +d.id;
      const active = EU_CODES.has(id) || US_CODES.has(id) || GB_CODES.has(id) || CA_CODES.has(id) || AU_CODES.has(id);
      if (!active && PLANNED.has(id)) {
        d3.select(this).attr('fill', '#2d3748');
        tooltip.style('opacity', '1').text('coming soon');
      }
    })
    .on('mousemove', event => {
      tooltip.style('left', (event.clientX + 12) + 'px').style('top', (event.clientY - 28) + 'px');
    })
    .on('mouseout', function(event, d) {
      const id = +d.id;
      const active = EU_CODES.has(id) || US_CODES.has(id) || GB_CODES.has(id) || CA_CODES.has(id) || AU_CODES.has(id);
      if (PLANNED.has(id) && !active) d3.select(this).attr('fill', '#1e3050');
      tooltip.style('opacity', '0');
    });
}

document.addEventListener('DOMContentLoaded', () => {
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
    .then(world => renderMap(world))
    .catch(() => {});
});

// ── Clock ──────────────────────────────────────────────────────────────────

function tickClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.getUTCHours().toString().padStart(2,'0') + ':' +
    now.getUTCMinutes().toString().padStart(2,'0') + ':' +
    now.getUTCSeconds().toString().padStart(2,'0') + ' UTC';
}
setInterval(tickClock, 1000);
tickClock();

// ── Policy Feed ────────────────────────────────────────────────────────────

let allPolicies  = [];
let activeFilter = 'ALL';
let searchQuery  = '';
let activeTag    = '';

function timeAgo(isoStr) {
  if (!isoStr) return 'unknown';
  const diff = Math.floor((Date.now() - new Date(isoStr)) / 60000);
  if (diff < 1)   return 'just now';
  if (diff < 60)  return diff + ' min ago';
  const h = Math.floor(diff / 60);
  if (h < 24)     return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

function fmt(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function scoreDir(score) {
  return score > 0 ? 'positive' : score < 0 ? 'negative' : 'neutral';
}

function scoreDisplay(score) {
  if (score === null || score === undefined) return '—';
  return (score > 0 ? '+' : '') + score;
}

function badgeClass(country, source) {
  if (country === 'EU') return 'eu';
  if (country === 'US') return 'us';
  if (country === 'GB') return 'gb';
  if (country === 'CA') return 'ca';
  if (country === 'AU') return 'au';
  return 'us';
}

function badgeLabel(source) {
  return {
    federal_register: 'FED. REGISTER',
    ec_press:         'EC PRESS',
    eurlex:           'EUR-LEX',
    uk_gov:           'GOV.UK',
    canada_gazette:   'CA GAZETTE',
    au_legislation:   'AU LEG.',
  }[source] || source.toUpperCase();
}

function setTag(tag) {
  activeTag = (activeTag === tag) ? '' : tag;
  renderGrid();
}

function renderTagChip() {
  const wrap = document.getElementById('tag-chip-wrap');
  if (!activeTag) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `<button class="tag-clear" id="tag-clear-btn">#${activeTag} &times;</button>`;
  document.getElementById('tag-clear-btn').addEventListener('click', () => { activeTag = ''; renderGrid(); });
}

function renderGrid() {
  const grid  = document.getElementById('policy-grid');
  const count = document.getElementById('results-count');
  renderTagChip();

  let list = allPolicies;
  if (activeFilter !== 'ALL') list = list.filter(p => p.country === activeFilter);
  if (activeTag) list = list.filter(p => (p.tags || []).some(t => t.toLowerCase() === activeTag));
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(p =>
      (p.title || '').toLowerCase().includes(q) ||
      (p.summary || '').toLowerCase().includes(q) ||
      (p.tags || []).some(t => t.toLowerCase().includes(q))
    );
  }

  count.textContent = list.length ? list.length + ' policies' : '';

  if (!list.length) {
    grid.innerHTML = `<div class="state-msg">${allPolicies.length ? 'no results' : 'no policies loaded'}</div>`;
    return;
  }

  grid.innerHTML = list.slice(0, 60).map(p => {
    const tags = (p.tags || []).map(t =>
      `<span class="tag${t.toLowerCase() === activeTag ? ' active' : ''}" data-tag="${t.toLowerCase()}">${t}</span>`
    ).join('');

    return `<div class="policy-card">
      <div class="card-top">
        <span class="source-badge ${badgeClass(p.country, p.source)}">${badgeLabel(p.source)}</span>
        <span class="card-date">${fmt(p.published_date)}</span>
      </div>
      <div class="card-title">${p.title || 'Untitled'}</div>
      <div class="card-summary">${p.summary || ''}</div>
      <div class="score-row">
        <div class="score-col social ${scoreDir(p.social_score)}">
          <span class="score-label">Social</span>
          <span class="score-num">${scoreDisplay(p.social_score)}</span>
          <span class="score-reason">${p.social_reason || ''}</span>
        </div>
        <div class="score-col env ${scoreDir(p.environmental_score)}">
          <span class="score-label">Env</span>
          <span class="score-num">${scoreDisplay(p.environmental_score)}</span>
          <span class="score-reason">${p.environmental_reason || ''}</span>
        </div>
        <div class="score-col eco ${scoreDir(p.economic_score)}">
          <span class="score-label">Econ</span>
          <span class="score-num">${scoreDisplay(p.economic_score)}</span>
          <span class="score-reason">${p.economic_reason || ''}</span>
        </div>
      </div>
      ${tags ? `<div class="tags">${tags}</div>` : ''}
      ${p.url ? `<a class="card-link" href="${p.url}" target="_blank" rel="noopener">source &rarr;</a>` : ''}
    </div>`;
  }).join('');
}

async function init() {
  document.getElementById('year').textContent = new Date().getFullYear();

  document.getElementById('filter-pills').addEventListener('click', e => {
    const btn = e.target.closest('.pill');
    if (!btn) return;
    activeFilter = btn.dataset.filter;
    if (activeFilter === 'ALL') activeTag = '';
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
  });

  document.getElementById('search').addEventListener('input', e => {
    searchQuery = e.target.value.trim();
    renderGrid();
  });

  document.getElementById('policy-grid').addEventListener('click', e => {
    const tag = e.target.closest('.tag');
    if (!tag) return;
    setTag(tag.dataset.tag);
  });

  try {
    const res  = await fetch(`policies.json?v=${Date.now()}`);
    const data = await res.json();
    allPolicies = Array.isArray(data) ? data : (data.policies || []);
    const lastUpdated = data.last_updated || null;
    const label = document.getElementById('updated-label');
    label.textContent = lastUpdated ? 'updated ' + timeAgo(lastUpdated) : 'live';
    if (lastUpdated) setInterval(() => { label.textContent = 'updated ' + timeAgo(lastUpdated); }, 30000);
  } catch {
    allPolicies = [];
    document.getElementById('updated-label').textContent = 'offline';
  }

  renderGrid();
}

init();
</script>
</body>
</html>
